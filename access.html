<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographie Accès Privilégiés</title>
<style>
:root{
  --bg:#f3f5fa;--surface:#fff;--surface-2:#f8fafc;--border:#e2e7ef;--border-strong:#cfd6e2;
  --text:#162033;--muted:#5f6b7f;--faint:#94a0b4;
  --primary:#4f46e5;--primary-600:#4338ca;--primary-50:#eef2ff;
  --server:#7c3aed;--account:#2563eb;--identity:#059669;
  --crit:#dc2626;--high:#ea580c;--med:#d97706;--low:#2563eb;--ok:#16a34a;
  --radius:12px;--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header.app{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;flex:none}
.brand-title{font-weight:700;font-size:15px;white-space:nowrap}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:8px;align-items:center;flex:1 1 520px;min-width:0;flex-wrap:wrap}
.filters select{max-width:190px}
.filters input[type=search]{flex:1;min-width:160px;max-width:380px}
input,select,textarea{border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;max-width:100%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.switch{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--border-strong);background:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-600)}
.btn.danger{color:var(--crit);border-color:#f3c4c4}
.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.icon{width:34px;justify-content:center;padding:7px 0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.menu{position:relative}
.menu-list{display:none;position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:270px;z-index:50}
.menu.open .menu-list{display:block}
.menu-list button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:6px;cursor:pointer}
.menu-list button:hover{background:var(--primary-50)}
.menu-list small{display:block;color:var(--muted);font-size:11px}
nav.tabs{display:flex;gap:2px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;align-items:center}
nav.tabs button{border:0;background:none;padding:11px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
.count{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}
.count:empty{display:none}
.save-state{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap;padding-left:12px}
main{flex:1;position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}
.scroll{overflow:auto;padding:18px}
.map-view{background:radial-gradient(circle,#dde3ed 1px,transparent 1px) 0 0/22px 22px,#f6f8fc}
#mapSvg{width:100%;height:100%;display:block;cursor:grab;user-select:none;touch-action:none}
#mapSvg.panning{cursor:grabbing}
#mapSvg .node{cursor:pointer}
#mapSvg .node:hover .body{stroke:#4f46e5}
#mapSvg [data-toggle]{cursor:pointer}
.map-tools{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.map-tools .btn{background:#fff;box-shadow:var(--shadow)}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none;padding:16px}
.empty[hidden]{display:none}
.empty-box{pointer-events:auto;background:#fff;border:1px dashed var(--border-strong);border-radius:16px;padding:28px 32px;max-width:460px;margin:auto}
.empty-box h3{margin:0 0 6px;color:var(--text)}
.empty-box .row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px}
.card h3 small{font-weight:400;color:var(--muted);margin-left:6px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.kpi .v{font-size:28px;font-weight:700;line-height:1.15}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.dash{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
.hbar{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hbar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{height:10px;background:#eef1f6;border-radius:6px;overflow:hidden}
.hbar-fill{height:100%;border-radius:6px}
.hbar-val{text-align:right;font-weight:600}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#eef1f6;margin:6px 0 10px}
.legend-row{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border);cursor:pointer}
.list li:first-child{border-top:0}
.list li:hover .t{color:var(--primary)}
.list .t{font-weight:600}
.list .d{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;line-height:18px}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff}
table.data th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none;z-index:1}
table.data th[data-action]{cursor:pointer}
table.data th[data-action]:hover{color:var(--text)}
table.data td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
table.data tbody tr[data-action]{cursor:pointer}
table.data tbody tr:hover td{background:#f7f8ff}
table.data tr.sel td{background:var(--primary-50)}
#tab-inventory table.data td{white-space:nowrap}
table.data tr.unjust td{background:#fee2e2;color:#991b1b}
table.data tr.unjust td:first-child{box-shadow:inset 4px 0 0 #dc2626}
table.data tbody tr.unjust:hover td{background:#fecaca}
table.data tr.unjust td small{color:#b91c1c}
table.data td small{color:var(--muted)}
.table-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);max-height:calc(100vh - 230px);background:#fff}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar h2{margin:0;font-size:17px}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.weak{color:var(--crit);font-weight:600}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .2s ease;z-index:30;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.drawer-head h2{margin:2px 0 2px;font-size:17px;word-break:break-word}
.drawer-body{padding:14px 18px;overflow:auto;flex:1}
.drawer-body h4{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.drawer-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.crumbs{font-size:12px;color:var(--muted)}
.crumbs a{color:var(--primary);cursor:pointer}
dl.props{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:13px}
dl.props dt{color:var(--muted)}
dl.props dd{margin:0;word-break:break-word}
.type-chip{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px;margin-left:auto}
.finding{border:1px solid var(--border);border-left:4px solid;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px;background:#fff}
.finding .ctl{font-size:11px;color:var(--muted);margin-top:2px}
.finding .reco{font-size:12px;margin-top:4px;color:#334155}
.children li{cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:min(660px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal-card.wide{width:min(940px,100%)}
.modal-card>form,.modal-card>.wrap{display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 32px)}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:16px}
.modal-body{padding:16px 20px;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
.field>span{font-weight:600}
.field small{color:var(--muted);font-size:11px}
.field.full,.check.full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.field.invalid input{border-color:var(--crit)}
.section-title{grid-column:1/-1;margin:6px 0 0;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;font-weight:700;border-bottom:1px solid var(--border);padding-bottom:4px}
.danger-zone{margin-top:18px;padding:12px;border:1px solid #f3c4c4;border-radius:10px;background:#fff7f7;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.people{grid-template-columns:repeat(auto-fill,minmax(370px,1fr))}
.person.hl{outline:3px solid var(--primary)}
.person-head{display:flex;gap:10px;align-items:center}
.person-head .grow{min-width:0}
.avatar{width:38px;height:38px;border-radius:50%;background:#d1fae5;color:#065f46;display:grid;place-items:center;font-weight:700;flex:none}
.stats-row{display:flex;gap:16px;margin:10px 0;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stats-row b{color:var(--text);font-size:15px;display:block}
table.mini{width:100%;border-collapse:collapse;font-size:12px}
table.mini td,table.mini th{padding:5px 4px;border-top:1px solid var(--border);text-align:left}
table.mini th{font-size:11px;color:var(--muted);font-weight:600;border-top:0}
table.mini tr[data-action]{cursor:pointer}
table.mini tr[data-action]:hover td{background:#f7f8ff}
.person-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.progress{height:8px;background:#eef1f6;border-radius:4px;overflow:hidden;min-width:120px}
.progress>div{height:100%;background:var(--ok);transition:width .2s}
.combo{position:relative;display:flex}
.combo input{flex:1;min-width:0;padding-right:30px}
.combo-btn{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 7px;font-size:12px}
.combo-list{position:fixed;z-index:300;background:#fff;border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow-lg);max-height:240px;overflow:auto;padding:4px}
.combo-list[hidden]{display:none}
.combo-opt{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.combo-opt.active{background:var(--primary-50);color:var(--primary-600)}
.combo-opt.cur::after{content:" ✓";color:var(--primary)}
.combo-empty{padding:7px 10px;color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#162033;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border-strong);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
select.dec{min-width:130px}
select.dec.d-Maintenir{border-color:#86efac;background:#f0fdf4}
select.dec.d-Modifier{border-color:#fcd34d;background:#fffbeb}
select.dec.d-Révoquer{border-color:#fca5a5;background:#fef2f2}
.help h4{margin:18px 0 6px}
.help p,.help li{color:#334155}
.help table{border-collapse:collapse;width:100%;font-size:13px}
.help td,.help th{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.help th{background:var(--surface-2)}
.note{font-size:12px;color:var(--muted);margin:6px 0 12px}
@media (max-width:760px){
  .filters{order:3;flex-basis:100%}
  .form-grid{grid-template-columns:1fr}
  dl.props{grid-template-columns:120px 1fr}
  .hbar{grid-template-columns:105px 1fr 34px}
  .legend{display:none}
  .people{grid-template-columns:1fr}
  .brand-sub{display:none}
  .scroll{padding:12px}
}
</style>
</head>
<body>

<header class="app">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2 4 5v6c0 5.1 3.4 9.6 8 11 4.6-1.4 8-5.9 8-11V5l-8-3zm-1 13.6-3.3-3.3 1.4-1.4 1.9 1.9 4.6-4.6 1.4 1.4-6 6z" fill="currentColor"/></svg></div>
    <div style="min-width:0">
      <div class="brand-title">Cartographie des accès privilégiés</div>
      <div class="brand-sub" id="brandSub">ISO/IEC 27001:2022</div>
    </div>
  </div>
  <div class="filters">
    <input id="search" type="search" placeholder="Rechercher serveur, compte, personne…  ( / )" autocomplete="off">
    <select id="entityFilter" title="Filtrer par entité"></select>
    <select id="assetFilter" title="Type d'actif"><option value="">Serveurs et SaaS</option><option value="server">Serveurs</option><option value="saas">SaaS</option></select>
    <label class="switch"><input type="checkbox" id="onlyIssues"> Constats uniquement</label>
  </div>
  <div class="actions">
    <button class="btn primary" data-action="add-server">+ Serveur</button>
    <button class="btn primary" data-action="add-saas" style="background:#0891b2;border-color:#0891b2">+ SaaS</button>
    <div class="menu">
      <button class="btn" data-menu>Importer ▾</button>
      <div class="menu-list">
        <button data-action="import-json">Fichier JSON…<small>Compatible avec les exports de l'ancienne version</small></button>
        <button data-action="import-b64">Coller une sauvegarde Base64…<small>Annexe du PDF d'audit</small></button>
        <button data-action="load-demo">Charger un jeu d'exemple</button>
      </div>
    </div>
    <div class="menu">
      <button class="btn" data-menu>Exporter ▾</button>
      <div class="menu-list">
        <button data-action="export-json">JSON — sauvegarde complète<small>Ctrl + S</small></button>
        <button data-action="export-pdf">PDF d'audit ISO 27001…</button>
        <button data-action="export-csv">CSV — inventaire des accès</button>
        <button data-action="export-drawio">Draw.io</button>
        <button data-action="export-svg">SVG — cartographie</button>
      </div>
    </div>
    <button class="btn" data-action="lists" title="Utilisateurs, rôles, approbateurs, justifications">Listes</button>
    <button class="btn icon" data-action="settings" title="Paramètres et règles">⚙</button>
    <button class="btn icon" data-action="help" title="Aide">?</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="dashboard">Tableau de bord</button>
  <button data-tab="map">Cartographie</button>
  <button data-tab="inventory">Inventaire</button>
  <button data-tab="people">Par personne</button>
  <button data-tab="reviews">Revues d'accès</button>
  <button data-tab="findings">Constats <span class="count" id="findingsCount"></span></button>
  <span class="save-state" id="saveState"></span>
</nav>

<main>
  <section id="tab-dashboard" class="view scroll"></section>
  <section id="tab-map" class="view map-view">
    <svg id="mapSvg" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><g id="mapLayer"></g></svg>
    <div class="map-tools">
      <button class="btn icon" data-action="zoom-in" title="Zoom avant">+</button>
      <button class="btn icon" data-action="zoom-out" title="Zoom arrière">−</button>
      <button class="btn" data-action="fit" title="Ajuster à l'écran">Ajuster</button>
      <button class="btn" data-action="expand-all">Tout déplier</button>
      <button class="btn" data-action="collapse-all">Tout replier</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--server)"></i>Serveur</span>
      <span><i style="background:#0891b2"></i>SaaS</span>
      <span><i style="background:var(--account)"></i>Compte</span>
      <span><i style="background:#d97706"></i>Groupe</span>
      <span><i style="background:var(--identity)"></i>Titulaire</span>
      <span><i style="background:#fee2e2;border:1.5px solid #dc2626"></i>Compte non justifié</span>
      <span><span class="dot" style="background:var(--crit)"></span>Critique</span>
      <span><span class="dot" style="background:var(--high)"></span>Élevé</span>
      <span><span class="dot" style="background:var(--med)"></span>Moyen</span>
      <span><span class="dot" style="background:var(--low)"></span>Faible</span>
      <span>Molette : zoom · Glisser : déplacer · Clic : détails</span>
    </div>
    <div class="empty" id="mapEmpty" hidden></div>
  </section>
  <section id="tab-inventory" class="view scroll"></section>
  <section id="tab-people" class="view scroll"></section>
  <section id="tab-reviews" class="view scroll"></section>
  <section id="tab-findings" class="view scroll"></section>
  <aside class="drawer" id="drawer" aria-label="Détails"></aside>
</main>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
'use strict';
/* =========================================================================
   Cartographie des accès privilégiés — ISO/IEC 27001:2022
   Modèle JSON rétro-compatible : { servers:[{accounts:[{identities:[]}]}], settings:{…} }
   Champs ajoutés (optionnels) : entity, criticality, owner, notes, privileged,
   unjustified, status, email, approvedBy, ticket, endDate, reviews[], journal[], meta{}
   ========================================================================= */

const STORAGE_KEY = 'cartographie-acces-iso27001-v3';
const APP_VERSION = '3.0';

const SEV = {
  critique: { label: 'Critique', color: '#dc2626', rank: 4 },
  elevee:   { label: 'Élevée',   color: '#ea580c', rank: 3 },
  moyenne:  { label: 'Moyenne',  color: '#d97706', rank: 2 },

function strFields(o, keys) { keys.forEach(k => { o[k] = o[k] == null ? '' : String(o[k]); }); }

    if (typeof def[k] === 'number' && !(Number(d.settings[k]) > 0)) d.settings[k] = def[k];
  }

/* ---------------- Moteur d'analyse ISO 27001 ---------------- */
function analyze() {
  const St = S(), t = todayISO(), F = []; let n = 0;
  const add = (sev, controls, title, detail, reco, ref) => F.push({ id: ++n, sev, controls, title, detail, reco, ref });
  const people = new Map();

  for (const s of data.servers) {
    const sl = s.name || '(sans nom)';
    for (const a of s.accounts) {
      if (!isGroupMember(s, a)) for (const i of a.identities) {
        const k = norm(i.name) || '(sans nom)';
        if (!people.has(k)) people.set(k, { key: k, name: i.name || '(sans nom)', email: '', entries: [] });
        const p = people.get(k); if (!p.email && i.email) p.email = i.email;
        p.entries.push({ s, a, i });
      }
      if (isGroup(a)) for (const m of groupMembers(s, a)) for (const i of namedIds(m)) {
        const k = norm(i.name);
        if (!people.has(k)) people.set(k, { key: k, name: i.name, email: '', entries: [] });
        people.get(k).entries.push({ s, a, i, via: m });
      }
      if (isActiveAccount(a) && a.unjustified) add(isPriv(a) ? 'elevee' : 'moyenne', ['A.5.18', 'A.8.2'], 'Compte non justifié', `${sl} › ${a.name || '(sans nom)'} : compte marqué « Non justifié ».`, 'Supprimer ou désactiver le compte, ou documenter sa justification puis cocher « Justifié ».', { sid: s.id, aid: a.id });
    }
  }

  const plist = [...people.values()];
  for (const p of plist) {
    const live = p.entries.filter(e => isActiveAccount(e.a));
    p.privServers = new Set(live.filter(e => isPriv(e.a) && norm(e.i.status) !== 'parti').map(e => String(e.s.id))).size;
    p.privCount = live.filter(e => isPriv(e.a)).length;
  }

  for (const m of data.manualFindings) {
    const r = m.ref || {}, s = r.sid != null ? getServer(r.sid) : null;
    const a = s && r.aid != null ? s.accounts.find(x => same(x.id, r.aid)) : null;
    const i = a && r.iid != null ? a.identities.find(x => same(x.id, r.iid)) : null;
    let ref = { global: true }, where = 'Global';
    if (i) { ref = { sid: s.id, aid: a.id, iid: i.id }; where = `${i.name} → ${s.name} › ${a.name}`; }
    else if (a && r.iid == null) { ref = { sid: s.id, aid: a.id }; where = `${s.name} › ${a.name}`; }
    else if (s && r.aid == null) { ref = { sid: s.id }; where = s.name; }
    else if (r.sid != null) where = 'Élément supprimé';
    add(m.sev, m.controls.length ? m.controls : ['—'], m.title, `${where}${m.detail ? ' : ' + m.detail : ''}`, m.reco || '—', ref);
    Object.assign(F[F.length - 1], { manual: true, mid: m.id });
  }

  F.sort((x, y) => SEV[y.sev].rank - SEV[x.sev].rank || x.title.localeCompare(y.title));
  const idx = { srvOwn: new Map(), srvAll: new Map(), accOwn: new Map(), accAll: new Map(), idOwn: new Map(), person: new Map() };
  const push = (m, k, f) => { if (!m.has(k)) m.set(k, []); m.get(k).push(f); };
  F.forEach(f => {
    const r = f.ref;
    if (r.person) { push(idx.person, r.person, f); return; }
    if (r.global) return;
    const s = String(r.sid); push(idx.srvAll, s, f);
    if (r.aid == null) { push(idx.srvOwn, s, f); return; }
    const ak = `${s}|${r.aid}`; push(idx.accAll, ak, f);
    if (r.iid == null) push(idx.accOwn, ak, f); else push(idx.idOwn, `${ak}|${r.iid}`, f);
  });
  const L = (m, k) => m.get(k) || [];
  const res = {
    findings: F, people: plist,
    srv: sid => L(idx.srvOwn, String(sid)), srvAll: sid => L(idx.srvAll, String(sid)),
    acc: (sid, aid) => L(idx.accOwn, `${sid}|${aid}`), accAll: (sid, aid) => L(idx.accAll, `${sid}|${aid}`),
    id: (sid, aid, iid) => L(idx.idOwn, `${sid}|${aid}|${iid}`), person: k => L(idx.person, k)
  };
  plist.forEach(p => { p.issues = [...new Set([...res.person(p.key), ...p.entries.flatMap(e => [...res.acc(e.s.id, e.a.id), ...res.id(e.s.id, e.a.id, e.i.id)])])]; });
  return res;
}

function computeStats() {
  const St = S(), t = todayISO();
  let accounts = 0, priv = 0, privStrong = 0, lines = 0, conf = 0;
  const rs = { ok: 0, soon: 0, overdue: 0, never: 0 }, auth = {}, entities = {}, upcoming = [];
  data.servers.forEach(s => {
    const e = s.entity || 'Non renseignée';
    entities[e] = entities[e] || { servers: 0, accounts: 0, findings: 0 };
    entities[e].servers++; entities[e].findings += A.srvAll(s.id).length;
    s.accounts.forEach(a => {
      accounts++; entities[e].accounts++;
      if (!isActiveAccount(a) || isGroup(a)) return;
      if (isPriv(a) && !isGroup(a)) { priv++; if (isStrong(a)) privStrong++; const m = a.authMethod || 'Non renseignée'; auth[m] = (auth[m] || 0) + 1; }
      const accBad = A.acc(s.id, a.id).some(f => SEV[f.sev].rank >= 2);
      if (!a.identities.length) { lines++; return; }
      a.identities.forEach(i => {
        lines++;
        const bad = accBad || A.id(s.id, a.id, i.id).some(f => SEV[f.sev].rank >= 2);
        if (!bad) conf++;
        if (norm(i.status) !== 'actif') return;
        const st = reviewState(i, a); rs[st.key]++;
        if (st.next && st.next >= t && daysBetween(t, st.next) <= St.dueSoonDays) upcoming.push({ s, a, i, next: st.next });
      });
    });
  });
  upcoming.sort((x, y) => x.next.localeCompare(y.next));
  const idTotal = rs.ok + rs.soon + rs.overdue + rs.never;
  return {
    servers: data.servers.length, accounts, priv, privStrong, lines, rs, auth, entities, upcoming,
    persons: A.people.length,
    entityCount: Object.keys(entities).filter(k => k !== 'Non renseignée').length,
    score: lines ? Math.round(conf / lines * 100) : null,
    coverage: idTotal ? Math.round((rs.ok + rs.soon) / idTotal * 100) : null,
    strongPct: priv ? Math.round(privStrong / priv * 100) : null
  };
}

    onSubmit: v => {
      const items = [];
      data.servers.forEach(s => {
        if (v.entity && s.entity !== v.entity) return;
        if (v.asset && (v.asset === 'saas') !== isSaas(s)) return;
        s.accounts.forEach(a => {
          if (!isActiveAccount(a) || (v.scope === 'priv' && !isPriv(a))) return;
          a.identities.forEach(i => {
            if (v.onlyDue && norm(i.status) === 'actif' && reviewState(i, a).key === 'ok') return;
            items.push({ sid: s.id, aid: a.id, iid: i.id, server: s.name, entity: s.entity, account: a.name, privileged: isPriv(a), auth: a.authMethod,
              identity: i.name, role: i.role, justification: i.justification, lastReview: i.lastReview,
              issues: [...A.acc(s.id, a.id), ...A.id(s.id, a.id, i.id)].map(f => f.title).join(' ; '), decision: '', comment: '', decidedAt: '' });
          });
        });
      });
      if (!items.length) { alert('Aucun accès dans ce périmètre.'); return false; }
      const scopeLabel = `${v.asset === 'saas' ? 'SaaS, ' : v.asset === 'server' ? 'serveurs, ' : ''}${v.entity || 'toutes entités'}, ${v.scope === 'priv' ? 'accès privilégiés' : 'tous les accès'}${v.onlyDue ? ', accès à revoir uniquement' : ''}`;
      data.reviews.unshift({ id: uid(), name: v.name, reviewer: v.reviewer, dueDate: v.dueDate, scopeLabel, status: 'open', createdAt: t, closedAt: '', items });
      log('Campagne de revue créée', `${v.name} (${items.length} accès, réviseur : ${v.reviewer})`);
      commit('Campagne créée');

}
function findCampaign(id) { return data.reviews.find(c => same(c.id, id)); }
function updateCampaignProgress(c) {
  const k = campaignCounts(c), done = k.total - k.pending;
  const t = $('#campProgressTxt'), b = $('#campProgressBar');
  if (t) t.textContent = `${done} / ${k.total} décidés`; if (b) b.style.width = (k.total ? done / k.total * 100 : 0) + '%';
}
function closeCampaign(id) {
  const c = findCampaign(id); if (!c) return;
  const k = campaignCounts(c);
  if (k.pending && !confirm(`${k.pending} accès sans décision : ils ne seront pas considérés comme revus.\nClôturer quand même ?`)) return;
  if (!k.pending && !confirm(`Clôturer « ${c.name} » et appliquer les décisions ?\n${k.keep} maintenu(s), ${k.modify} modifié(s), ${k.revoke} révoqué(s).`)) return;
  const t = todayISO();
  c.items.forEach(it => {
    if (!it.decision) return;
    const a = getAccount(it.sid, it.aid), i = a && a.identities.find(x => same(x.id, it.iid));
    if (!i) { it.applied = 'Accès introuvable à la clôture'; return; }
    if (it.decision === 'Révoquer') i.status = 'À révoquer';
    else { i.lastReview = t; i.nextReview = addMonths(t, periodFor(a)); }
    if (it.comment) i.notes = [i.notes, `[Revue ${fmtDate(t)}] ${it.decision} : ${it.comment}`].filter(Boolean).join('\n');
    it.applied = 'Appliqué';
  });
  c.status = 'closed'; c.closedAt = t;
  log('Campagne de revue clôturée', `${c.name} — ${k.keep} maintenu(s), ${k.modify} modifié(s), ${k.revoke} révoqué(s), ${k.pending} sans décision`);
  commit('Campagne clôturée — pensez à générer le PV signé');
}

function download(name, content, mime) {

  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

  data = normalize(parsed); syncListChanges();

function P(s) {
  return String(s ?? '').replace(/[\u2018\u2019\u2032]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014\u2212]/g, '-').replace(/\u2026/g, '...')
    .replace(/[\u00A0\u202F\u2009]/g, ' ').replace(/[\u203A\u2192]/g, '>').replace(/\u2265/g, '>=').replace(/\u2264/g, '<=').replace(/\u0153/g, 'oe').replace(/\u0152/g, 'OE').replace(/\u20AC/g, 'EUR')
    .replace(/[^\x00-\xFF]/g, '');
}
async function sha256(str) {
  try { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch { return 'indisponible (contexte non sécurisé)'; }
}
function pdfBase(title, classification) {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error("La librairie jsPDF n'est pas chargée (accès à cdnjs.cloudflare.com requis).");
  const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  if (typeof doc.autoTable !== 'function') throw new Error("Le module jsPDF-AutoTable n'est pas chargé.");

  doc.setFillColor(79, 70, 229); doc.rect(0, 0, W, 22, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text(P(title), 14, 14);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.text(P('ISO/IEC 27001:2022 - ' + classification), W - 14, 14, { align: 'right' });
  doc.setTextColor(22, 32, 51);
  const ctx = { doc, W, H, y: 32 };
  ctx.newPageIf = need => { if (ctx.y > H - need) { doc.addPage(); ctx.y = 18; } };
  ctx.section = t => { ctx.newPageIf(35); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(79, 70, 229); doc.text(P(t), 14, ctx.y); doc.setTextColor(22, 32, 51); ctx.y += 4; };
  ctx.table = opts => {
    doc.autoTable(Object.assign({ startY: ctx.y, margin: { left: 14, right: 14, top: 16, bottom: 14 },
      styles: { font: 'helvetica', fontSize: 8, cellPadding: 1.8, overflow: 'linebreak', textColor: [22, 32, 51], lineColor: [226, 231, 239], lineWidth: 0.1 },
      headStyles: { fillColor: [238, 242, 255], textColor: [67, 56, 202], fontStyle: 'bold' }, alternateRowStyles: { fillColor: [248, 250, 252] } }, opts));
    ctx.y = doc.lastAutoTable.finalY + 8;
  };
  ctx.text = (t, size = 9) => {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(size);
    doc.splitTextToSize(P(t), W - 28).forEach(l => { ctx.newPageIf(16); doc.text(l, 14, ctx.y); ctx.y += size * 0.45; });
    ctx.y += 4;
  };
  ctx.signatures = boxes => {
    ctx.newPageIf(62); ctx.section('Validation et signatures'); ctx.y += 2;
    const bw = (W - 28 - (boxes.length - 1) * 6) / boxes.length;
    boxes.forEach((b, k) => {
      const x = 14 + k * (bw + 6);
      doc.setDrawColor(160, 170, 190); doc.setLineWidth(0.3); doc.roundedRect(x, ctx.y, bw, 42, 2, 2);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text(P(b[0]), x + 3, ctx.y + 6);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(95, 107, 127); doc.text(P(b[1]), x + 3, ctx.y + 11); doc.setTextColor(22, 32, 51);
      doc.text('Nom :', x + 3, ctx.y + 20); doc.text('Date :', x + 3, ctx.y + 27); doc.text('Signature :', x + 3, ctx.y + 34);
    });
    ctx.y += 50;
  };
  ctx.footer = (skip = () => false) => {
    const n = doc.internal.getNumberOfPages(), gen = `Généré le ${fmtDate(todayISO())} à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
    for (let p = 1; p <= n; p++) {
      if (skip(p)) continue;
      doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(120, 130, 150);
      doc.text(P(`${classification} - Page ${p}/${n}`), 14, H - 6); doc.text(P(gen), W - 14, H - 6, { align: 'right' });
    }
  };
  ctx.sevCell = col => d => { if (d.section === 'body' && d.column.index === col) { const k = Object.keys(SEV).find(x => SEV[x].label === d.cell.raw); if (k) { d.cell.styles.textColor = hexRgb(SEV[k].color); d.cell.styles.fontStyle = 'bold'; } } };
  return ctx;
}

/* ---------------- Événements globaux ---------------- */
function closeMenus() { document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); }

  'edit': editSelected, 'add-child': addChild, 'remove-member': el => removeMember(el.dataset.aid), 'add-group': () => { const c = ctxSel(); if (c) editAccount(c.s, null, true); }, 'delete': deleteSelected, 'mark-reviewed': markReviewed,
  'goto': el => select(parseRef(el.dataset.ref)),
  'finding': el => openFinding(Number(el.dataset.fid)),
  'tab': el => setTab(el.dataset.tabTarget),
  'sort': el => { const k = el.dataset.key; ui.sort = { key: k, dir: ui.sort.key === k ? -ui.sort.dir : 1 }; renderInventory(); },
  'sev-toggle': el => { const k = el.dataset.sev; ui.findSev.has(k) ? ui.findSev.delete(k) : ui.findSev.add(k); renderFindings(); },

document.addEventListener('click', e => {
  const m = e.target.closest('[data-menu]');
  if (m) { const menu = m.parentElement, was = menu.classList.contains('open'); closeMenus(); if (!was) menu.classList.add('open'); return; }
  const tb = e.target.closest('#tabs [data-tab]');
  if (tb) { setTab(tb.dataset.tab); return; }
  if (e.target.matches('input, select, textarea') && !e.target.closest('[data-menu]')) return;
  const el = e.target.closest('[data-action]');
  if (el && !el.disabled) { closeMenus(); const fn = actions[el.dataset.action]; if (fn) { e.preventDefault(); fn(el, e); } return; }
  if (!e.target.closest('.menu')) closeMenus();
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.excl) { t.closest('.excl').querySelectorAll('input[data-excl]').forEach(o => { if (o !== t) o.checked = !t.checked; }); return; }
  if (t.dataset && t.dataset.kind === 'justif') { const r = parseRef(t.dataset.ref); setUnjustified(getAccount(r.sid, r.aid), t.dataset.val === 'n' ? t.checked : !t.checked, getServer(r.sid)); return; }

    if (t.dataset.kind === 'decision') { it.decision = t.value; it.decidedAt = t.value ? todayISO() : ''; t.className = 'dec d-' + t.value; }

/* ---- Listes déroulantes : toutes les options à l'ouverture, filtre seulement à la frappe ---- */
const combo = { input: null, items: [], active: -1 };
const comboSources = {};
const comboEl = document.createElement('div'); comboEl.className = 'combo-list'; comboEl.hidden = true; document.body.appendChild(comboEl);
function comboOpen(input, filter) {
  const key = input.dataset.combo, all = (comboSources[key] ? comboSources[key]() : S()[key]) || [], q = norm(filter), cur = norm(input.value);
  const items = q ? all.filter(o => norm(o).includes(q)) : all.slice();
  combo.input = input; combo.items = items; combo.active = items.findIndex(o => norm(o) === cur); if (combo.active < 0 && q && items.length) combo.active = 0;
  comboEl.innerHTML = items.length
    ? items.map((o, k) => `<div class="combo-opt${k === combo.active ? ' active' : ''}${norm(o) === cur ? ' cur' : ''}" data-k="${k}">${esc(o)}</div>`).join('')
    : `<div class="combo-empty">${q ? 'Aucune correspondance : la valeur saisie sera ajoutée à la liste' : 'Liste vide : saisissez une valeur'}</div>`;
  const r = input.closest('.combo').getBoundingClientRect();
  comboEl.style.left = r.left + 'px'; comboEl.style.width = r.width + 'px'; comboEl.style.top = (r.bottom + 4) + 'px';
  comboEl.hidden = false;
  const hgt = comboEl.offsetHeight;
  if (r.bottom + 4 + hgt > innerHeight - 8 && r.top - hgt - 4 > 8) comboEl.style.top = (r.top - hgt - 4) + 'px';
  if (combo.active >= 0) comboEl.children[combo.active].scrollIntoView({ block: 'nearest' }); else comboEl.scrollTop = 0;
}
function comboClose() { comboEl.hidden = true; combo.input = null; combo.items = []; combo.active = -1; }
function comboPick(k) { const v = combo.items[k]; if (v == null || !combo.input) return; combo.input.value = v; combo.input.dispatchEvent(new Event('change', { bubbles: true })); comboClose(); }
function comboMove(d) {
  if (!combo.items.length) return;
  combo.active = (combo.active + d + combo.items.length) % combo.items.length;
  [...comboEl.children].forEach((c, k) => c.classList.toggle('active', k === combo.active));
  comboEl.children[combo.active].scrollIntoView({ block: 'nearest' });
}
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input[data-combo]')) { comboOpen(e.target, ''); e.target.select(); } });
document.addEventListener('focusout', e => { if (e.target === combo.input) setTimeout(() => { if (combo.input && document.activeElement !== combo.input) comboClose(); }, 120); });
document.addEventListener('input', e => { if (e.target.matches && e.target.matches('input[data-combo]')) comboOpen(e.target, e.target.value); });
document.addEventListener('mousedown', e => {
  const o = e.target.closest('.combo-opt'); if (o) { e.preventDefault(); comboPick(Number(o.dataset.k)); return; }
  if (e.target.closest('.combo-list')) { e.preventDefault(); return; }
  const b = e.target.closest('.combo-btn');
  if (b) { e.preventDefault(); const inp = b.parentElement.querySelector('input'); if (combo.input === inp && !comboEl.hidden) comboClose(); else { inp.focus(); comboOpen(inp, ''); } return; }
  if (e.target.matches('input[data-combo]') && document.activeElement === e.target && comboEl.hidden) comboOpen(e.target, '');
});
document.addEventListener('scroll', e => { if (!comboEl.hidden && !comboEl.contains(e.target)) comboClose(); }, true);
window.addEventListener('resize', comboClose);
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input[data-combo]')) {
    const open = !comboEl.hidden && combo.input === e.target;
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) comboOpen(e.target, ''); else comboMove(1); return; }
    if (e.key === 'ArrowUp' && open) { e.preventDefault(); comboMove(-1); return; }
    if (e.key === 'Enter' && open) { e.preventDefault(); if (combo.active >= 0) comboPick(combo.active); else comboClose(); return; }
    if (e.key === 'Escape' && open) { e.preventDefault(); e.stopImmediatePropagation(); comboClose(); return; }
    if (e.key === 'Tab') comboClose();
  }
}, true);
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === 'Escape') { if ($('#modal').classList.contains('open')) closeModal(); else if (ui.selected) select(null); closeMenus(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); exportJSON(); return; }
  if (!typing && e.key === '/') { e.preventDefault(); $('#search').focus(); }
});
window.addEventListener('resize', () => {
  if (ui.tab === 'map' && ui.vb && mapSvg.clientWidth) { ui.vb.h = ui.vb.w * mapSvg.clientHeight / mapSvg.clientWidth; applyVB(); }
});
